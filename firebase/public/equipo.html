<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registrar equipo · IV ITSANET</title><link rel="stylesheet" href="./css/app.css"><link rel="stylesheet" href="./css/marca.css?v=20261111-76"></head><body><main style="max-width:650px;margin:35px auto;padding:20px"><h1>Registrar mi equipo</h1><p>Solicita la autorización del móvil o la laptop que estás utilizando. Cada persona utiliza su propia cuenta; ADMIN debe verificar presencialmente el equipo.</p><form id="equipo"><label class="campo"><span>Usuario o correo</span><input id="usuario" autocomplete="username" required></label><label class="campo"><span>Contraseña del aplicativo</span><input id="clave" type="password" autocomplete="current-password" required></label><label class="campo"><span>Tipo de equipo</span><select id="tipo"><option value="MOVIL">Móvil / handheld</option><option value="LAPTOP">Laptop</option></select></label><label class="campo"><span>Nombre del equipo</span><input id="nombre" minlength="3" maxlength="100" placeholder="Ej.: Handheld de Juan · Bodega Quito" required></label><button id="solicitar" class="b-primario">Solicitar autorización</button></form><p id="estado" role="status"></p><p><a href="./">Volver al aplicativo</a></p></main><script type="module">
import {pedir} from './js/local.js?v=20261111-76';
const $=id=>document.getElementById(id);
$('equipo').addEventListener('submit',async e=>{e.preventDefault();$('solicitar').disabled=true;try{const r=await pedir('/dispositivos/solicitar',{base:'/api/auth',cuerpo:{usuario:$('usuario').value,pin:$('clave').value,tipo:$('tipo').value,nombre:$('nombre').value}});$('estado').textContent=r.mensaje;$('clave').value='';}catch(error){$('estado').textContent=error.message;}finally{$('solicitar').disabled=false;}});
</script></body></html>
